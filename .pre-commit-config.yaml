---
default_install_hook_types: [commit-msg, pre-commit, pre-push]

repos:
  # Freeze revs to commits, so a moved tag cannot change the hook code. Renovate cannot convert a
  # tag rev to this format, but it keeps a frozen rev frozen when it updates it.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # end-of-file-fixer opens every file for writing, even ones it leaves unchanged, and the
      # Claude Code sandbox denies writes to .vscode/. oxfmt enforces the final newline there.
      - id: end-of-file-fixer
        exclude: ^\.vscode/
        stages: [pre-commit, manual]

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit, manual]

      - id: check-merge-conflict
        stages: [pre-commit, manual]

      - id: check-json
        exclude: ^managed/private_Library/private_Application.Support/private_Code/User/modify_private_settings\.json$
        stages: [pre-commit, manual]

      - id: check-toml
        exclude: ^managed/.*/modify_.*\.toml$
        stages: [pre-commit, manual]

      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$
        stages: [pre-commit, manual]

  - repo: local
    hooks:
      - id: lint-commit-msg
        name: lint-commit-msg
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true

      - id: format-oxfmt
        name: format-oxfmt
        entry: mise run format:oxfmt
        language: system
        types_or: [json, markdown, yaml]
        stages: [pre-commit]

      - id: format-toml
        name: format-toml
        entry: mise run format:toml
        language: system
        types_or: [toml]
        stages: [pre-commit]

      - id: format-lua
        name: format-lua
        entry: mise run format:lua
        language: system
        types_or: [lua]
        stages: [pre-commit]

      - id: lint-yaml
        name: lint-yaml
        entry: mise run lint:yaml
        language: system
        types_or: [yaml]
        exclude: ^pnpm-lock\.yaml$
        stages: [pre-commit]

      # fish and shell hooks own their commands: chezmoi source names (dot_zshrc,
      # completions/_*) defeat type-based filtering, so file discovery lives here
      # and the mise format:fish, format:sh, lint:fish, lint:sh, and lint:zsh tasks wrap
      # these hooks.
      - id: format-fish
        name: format-fish
        entry: fish_indent --write
        language: system
        types_or: [fish]
        stages: [pre-commit]

      - id: format-fish-check
        name: format-fish-check
        entry: fish_indent --check
        language: system
        types_or: [fish]
        stages: [manual]

      # fish and zsh read only their first file argument as a script, so these hooks loop.
      - id: lint-fish
        name: lint-fish
        entry: sh -c
        args:
          - 'status=0; for file do fish --no-execute "$file" || status=1; done; exit "$status"'
          - --
        language: system
        types_or: [fish]
        stages: [pre-commit]

      - id: format-sh
        name: format-sh
        entry: mise exec -- shfmt -w
        language: system
        files: ^(.*\.(sh|sh\.tmpl|bash|zsh)|managed/dot_(bash|zsh)rc|managed/dot_config/tmux/tmux\.conf\.tmpl|managed/dot_config/zsh/completions/_.*|managed/dot_local/bin/executable_.*)$
        exclude: ^managed/dot_local/bin/executable_(generate-completions|tmx)$
        stages: [pre-commit]

      - id: format-sh-check
        name: format-sh-check
        entry: mise exec -- shfmt -d
        language: system
        files: ^(.*\.(sh|sh\.tmpl|bash|zsh)|managed/dot_(bash|zsh)rc|managed/dot_config/tmux/tmux\.conf\.tmpl|managed/dot_config/zsh/completions/_.*|managed/dot_local/bin/executable_.*)$
        exclude: ^managed/dot_local/bin/executable_(generate-completions|tmx)$
        stages: [manual]

      # ShellCheck does not support zsh, so this hook covers only sh and bash files.
      - id: lint-sh
        name: lint-sh
        entry: mise exec -- shellcheck
        language: system
        files: ^(.*\.(sh|sh\.tmpl|bash)|managed/dot_bashrc|managed/dot_local/bin/executable_.*)$
        exclude: ^managed/dot_local/bin/executable_(generate-completions|tmx)$
        stages: [pre-commit]

      - id: lint-zsh
        name: lint-zsh
        entry: sh -c
        args:
          - 'status=0; for file do zsh --no-exec "$file" || status=1; done; exit "$status"'
          - --
        language: system
        files: ^(.*\.zsh|managed/dot_zshrc|managed/dot_config/zsh/completions/_.*)$
        stages: [pre-commit]

      - id: lint-python-fix
        name: lint-python-fix
        entry: mise run lint:python:fix
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: format-python
        name: format-python
        entry: mise run format:python
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: test
        name: test
        entry: mise run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
