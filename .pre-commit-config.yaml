---
default_install_hook_types: [commit-msg, pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        stages: [pre-commit, manual]

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit, manual]

      - id: check-merge-conflict
        stages: [pre-commit, manual]

      - id: check-json
        exclude: ^managed/private_Library/private_Application.Support/private_Code/User/modify_settings\.json$
        stages: [pre-commit, manual]

      - id: check-toml
        exclude: ^managed/.*/modify_.*\.toml$
        stages: [pre-commit, manual]

      - id: check-yaml
        stages: [pre-commit, manual]

  - repo: local
    hooks:
      - id: lint-commit-msg
        name: lint-commit-msg
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true

      - id: format-oxfmt
        name: format-oxfmt
        entry: mise run format:oxfmt
        language: system
        types_or: [json, markdown, yaml]
        stages: [pre-commit]

      - id: format-toml
        name: format-toml
        entry: mise run format:toml
        language: system
        types_or: [toml]
        stages: [pre-commit]

      - id: format-lua
        name: format-lua
        entry: mise run format:lua
        language: system
        types_or: [lua]
        stages: [pre-commit]

      - id: lint-yaml
        name: lint-yaml
        entry: mise run lint:yaml
        language: system
        types_or: [yaml]
        exclude: ^pnpm-lock\.yaml$
        stages: [pre-commit]

      # fish and shell hooks own their commands: chezmoi source names (dot_zshrc,
      # completions/_*) defeat type-based filtering, so file discovery lives here
      # and the mise format:fish/format:sh tasks wrap these hooks.
      - id: format-fish
        name: format-fish
        entry: fish_indent --write
        language: system
        types_or: [fish]
        stages: [pre-commit]

      - id: format-fish-check
        name: format-fish-check
        entry: fish_indent --check
        language: system
        types_or: [fish]
        stages: [manual]

      - id: format-sh
        name: format-sh
        entry: mise exec -- shfmt -w
        language: system
        files: ^(.*\.(sh|bash|zsh)|managed/dot_zshrc|managed/dot_config/zsh/completions/_.*)$
        stages: [pre-commit]

      - id: format-sh-check
        name: format-sh-check
        entry: mise exec -- shfmt -d
        language: system
        files: ^(.*\.(sh|bash|zsh)|managed/dot_zshrc|managed/dot_config/zsh/completions/_.*)$
        stages: [manual]

      - id: lint-python-fix
        name: lint-python-fix
        entry: mise run lint:python:fix
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: format-python
        name: format-python
        entry: mise run format:python
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: test
        name: test
        entry: mise run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
