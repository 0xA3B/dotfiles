[files]
exclude = ["**/mise.lock", "**/uv.lock"]
respect-ignore-files = true

[format.rules]
indent-width = 4
line-width = 100
trailing-comment-alignment = true
trailing-comment-space-width = 2

[[schemas]]
path = "tombi://www.schemastore.org/pyproject.json"
include = ["pyproject.toml"]
format.rules.array-values-order.enabled = true
format.rules.table-keys-order.enabled = true
