#!/usr/bin/env -S uv run --quiet --script
# vim: set filetype=python :
#
# /// script
# requires-python = ">=3.14,<3.15"
# dependencies = ["tomlkit<0.16"]
# ///

from __future__ import annotations

import os
import sys
from pathlib import Path


def add_helper_path() -> None:
    """Add the repo helper library to sys.path."""
    chezmoi_source_dir = os.environ.get("CHEZMOI_SOURCE_DIR")
    if chezmoi_source_dir is None:
        sys.exit("modify_uv.toml: CHEZMOI_SOURCE_DIR is not set")
    sys.path.insert(0, str(Path(chezmoi_source_dir).parent / "tools"))


add_helper_path()

from chezmoi_modify.exceptions import ChezmoiModifyError
from chezmoi_modify.source import read_overlay_directory
from chezmoi_modify.toml import compose_toml_overlays, merge_toml_overlay

# uv identifies an index by its URL, so overlays and the live file match entries by it.
ARRAY_TABLE_IDENTITY = {"index": ("url",)}


def main() -> None:
    """Merge the uv.toml.d overlays of every source into the live uv config.

    Design: docs/adr/0002-primary-source-composes-overlay-directories.md.
    """
    modify_script = os.environ.get("CHEZMOI_SOURCE_FILE")
    if not modify_script:
        sys.exit("modify_uv.toml: CHEZMOI_SOURCE_FILE is not set")
    managed = compose_toml_overlays(
        read_overlay_directory(modify_script),
        array_table_identity=ARRAY_TABLE_IDENTITY,
    )
    result = merge_toml_overlay(
        sys.stdin.read(),
        managed,
        array_table_identity=ARRAY_TABLE_IDENTITY,
    )
    for diagnostic in result.diagnostics:
        print(f"{diagnostic.severity}: {diagnostic.message}", file=sys.stderr)
    sys.stdout.write(result.text)


if __name__ == "__main__":
    try:
        main()
    except ChezmoiModifyError as error:
        sys.exit(f"modify_uv.toml: {error}")
