[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
lockfile = true
minimum_release_age = "3d"

[tools]
uv = "0.12.9"
pnpm = "11"
shfmt = "3"
stylua = "2"
tombi = "1.5.0"
yamllint = "1"

[tasks.check]
depends = ["format:check", "lint", "typecheck", "test"]
description = "Run the full local gate"

[tasks.format]
depends = [
    "format:hygiene",
    "format:lua",
    "format:oxfmt",
    "format:python",
    "format:shell",
    "format:toml",
]
description = "Run all formatters and hygiene fixers"

[tasks."format:check"]
depends = [
    "format:oxfmt:check",
    "format:toml:check",
    "format:lua:check",
    "format:python:check",
    "format:shell:check",
]
description = "Check all formatting without mutating"

# The fish and sh tasks wrap their pre-commit hooks instead of delegation running the
# other way: chezmoi source names (dot_zshrc, completions/_*) defeat type-based
# filtering, so file discovery lives in the hook filters.
[tasks."format:fish"]
description = "Format fish files with fish_indent"
run = "uv run pre-commit run format-fish --all-files"

[tasks."format:fish:check"]
description = "Check fish formatting with fish_indent"
run = "uv run pre-commit run format-fish-check --hook-stage manual --all-files"

[tasks."format:hygiene"]
description = "Run pre-commit hygiene hooks across all files; may modify files"
run = "uv run pre-commit run --all-files --hook-stage manual"

# eval re-splits $usage_paths (mise shell-quotes each value) so pre-commit can pass
# staged filenames — including paths with spaces — while defaulting to the whole repo.
[tasks."format:lua"]
description = "Format Lua files with StyLua"
usage = 'arg "[paths]" var=#true default="."'
run = "eval stylua $usage_paths"

[tasks."format:lua:check"]
description = "Check Lua formatting with StyLua"
run = "stylua --check ."

[tasks."format:oxfmt"]
description = "Format JSON, Markdown, and YAML files with oxfmt"
run = "pnpm exec oxfmt --write --no-error-on-unmatched-pattern"

[tasks."format:oxfmt:check"]
description = "Check JSON, Markdown, and YAML formatting with oxfmt"
run = "pnpm exec oxfmt --check"

[tasks."format:python"]
description = "Format Python files with Ruff"
run = "uv run ruff format"

[tasks."format:python:check"]
description = "Check Python formatting with Ruff"
run = "uv run ruff format --check"

[tasks."format:sh"]
description = "Format POSIX shell files with shfmt"
run = "uv run pre-commit run format-sh --all-files"

[tasks."format:sh:check"]
description = "Check POSIX shell formatting with shfmt"
run = "uv run pre-commit run format-sh-check --hook-stage manual --all-files"

[tasks."format:shell"]
depends = ["format:fish", "format:sh"]
description = "Format all shell files"

[tasks."format:shell:check"]
depends = ["format:fish:check", "format:sh:check"]
description = "Check all shell formatting"

[tasks."format:toml"]
description = "Format TOML files with Tombi"
run = "tombi format"

[tasks."format:toml:check"]
description = "Check TOML formatting with Tombi"
run = "tombi format --check"

[tasks.lint]
depends = ["lint:python", "lint:yaml"]
description = "Run all linters"

[tasks."lint:python"]
description = "Lint Python files with Ruff"
run = "uv run ruff check"

[tasks."lint:python:fix"]
description = "Apply safe Ruff fixes to Python files"
run = "uv run ruff check --fix"

# eval + usage: see the format:lua comment.
[tasks."lint:yaml"]
description = "Lint YAML files with yamllint"
usage = 'arg "[paths]" var=#true default="."'
run = "eval yamllint $usage_paths"

[tasks.setup]
description = "Install dependencies and git hooks"
run = [
    "pnpm install --frozen-lockfile",
    "uv sync --frozen",
    "uv run pre-commit install",
]

[tasks."setup:clean"]
description = "Reinstall dependencies from scratch using lockfiles"
run = [
    "pnpm ci",
    "uv venv --clear",
    "uv sync --frozen",
    "uv run pre-commit install",
]

[tasks.test]
description = "Run the Python test suite with pytest"
run = "uv run pytest"

[tasks.typecheck]
description = "Type-check the Python helper library with mypy"
run = "uv run mypy"
