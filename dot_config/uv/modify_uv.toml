# ///

from __future__ import annotations

import os
import sys
from pathlib import Path


def add_helper_path() -> None:
    """Add the repo helper library to sys.path."""
    chezmoi_source_dir = os.environ.get("CHEZMOI_SOURCE_DIR")
    if chezmoi_source_dir is None:
        sys.exit("modify_uv.toml: CHEZMOI_SOURCE_DIR is not set")
    sys.path.insert(0, str(Path(chezmoi_source_dir) / "tools"))


add_helper_path()

from chezmoi_modify.exceptions import ChezmoiModifyError
from chezmoi_modify.source import read_source_text
from chezmoi_modify.toml import merge_toml_overlay

MANAGED_CONFIG_SOURCE_PATH = "dot_config/uv/uv.managed.toml"


def main() -> None:
    """Merge managed uv config into the live uv config."""
    managed = read_source_text(MANAGED_CONFIG_SOURCE_PATH)
    result = merge_toml_overlay(
        sys.stdin.read(),
        managed,
        array_table_identity={"index": ("url",)},
    )
    for diagnostic in result.diagnostics:
        print(f"{diagnostic.severity}: {diagnostic.message}", file=sys.stderr)
    sys.stdout.write(result.text)


if __name__ == "__main__":
    try:
        main()
    except ChezmoiModifyError as error:
        sys.exit(f"modify_uv.toml: {error}")
